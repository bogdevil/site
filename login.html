<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Вход в админку</title>
  <style>
    :root {
      --bg: #f6f2ea;
      --paper: #fffdf8;
      --ink: #17211f;
      --muted: #68746f;
      --line: #ded8cc;
      --dark: #153d35;
      --accent: #f06449;
      --shadow: 0 20px 60px rgba(23, 33, 31, .12);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(240, 100, 73, .18), transparent 30%),
        radial-gradient(circle at 82% 12%, rgba(32, 163, 158, .18), transparent 32%),
        linear-gradient(135deg, #fffdf8, var(--bg));
      color: var(--ink);
    }

    form {
      width: min(100%, 430px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: clamp(18px, 5vw, 30px);
    }

    .mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--dark), #20a39e);
      font-weight: 950;
      margin-bottom: 18px;
    }

    h1 { margin: 0 0 8px; font-size: 34px; line-height: 1; }
    p { margin: 0 0 18px; color: var(--muted); }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 850; }
    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: #20a39e; box-shadow: 0 0 0 4px rgba(32, 163, 158, .12); }
    button {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    .status { min-height: 22px; margin-top: 12px; color: #a83226; font-weight: 850; }
    a { display: inline-block; margin-top: 8px; color: var(--dark); font-weight: 850; }
  </style>
</head>
<body>
  <form id="loginForm">
    <div class="mark">M</div>
    <h1>Вход</h1>
    <p>Админка откроется только после проверки пароля на сервере.</p>
    <label>
      Пароль администратора
      <input id="password" type="password" autocomplete="current-password" autofocus>
    </label>
    <button type="submit">Войти</button>
    <div class="status" id="status"></div>
    <a href="/">Вернуться на сайт</a>
  </form>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const status = document.getElementById("status");
      status.textContent = "Проверяем пароль...";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value })
        });
        if (!response.ok) throw new Error("bad password");
        location.href = "/admin.html";
      } catch {
        status.textContent = "Неверный пароль.";
        document.getElementById("password").value = "";
      }
    });
  </script>
</body>
</html>
